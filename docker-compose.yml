services:
  holiday-planner:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5000}:5000"
    environment:
      DATABASE_PATH: /app/data/holidays.db
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_API_KEY: ${LLM_API_KEY:-lm-studio}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 10s
      retries: 3
